name: grcone-stage

# Keep this file, stage.env and grcone-app.jar in the same deployment directory.
# Bind paths are relative to this file, including persistent data/minio.
services:
  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    pull_policy: never
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in stage.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in stage.env}
    volumes:
      - type: bind
        source: ./data/minio
        target: /data
        bind:
          create_host_path: true
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://localhost:9000/minio/health/ready || MC_HOST_health=http://127.0.0.1:9000 mc ready health
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    image: ${JAVA_IMAGE:-eclipse-temurin:21-jre-noble}
    pull_policy: never
    restart: unless-stopped
    working_dir: /opt/grcone
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${APP_JAR_PATH:-./grcone-app.jar}
        target: /opt/grcone/grcone-app.jar
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/app/logs
        target: /opt/grcone/logs
        bind:
          create_host_path: true
    environment:
      SERVER_PORT: 8080
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      DB_URL: ${DB_URL:?Set DB_URL for external Oracle in stage.env}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in stage.env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in stage.env}
      DB_DRIVER_CLASS_NAME: oracle.jdbc.OracleDriver
      DB_SCHEMA: ${DB_SCHEMA:?Set DB_SCHEMA in stage.env}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}

      GRCONE_MINIO_ENABLED: "true"
      GRCONE_MINIO_ENDPOINT: http://minio:9000
      GRCONE_MINIO_PUBLIC_ENDPOINT: ${GRCONE_MINIO_PUBLIC_ENDPOINT:-${DIGIGRCONE_MINIO_PUBLIC_ENDPOINT:-${GRCPC_MINIO_PUBLIC_ENDPOINT:-${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:${APP_PORT:-8080}}}}
      GRCONE_MINIO_PRESIGN_REGION: ${GRCONE_MINIO_PRESIGN_REGION:-${DIGIGRCONE_MINIO_PRESIGN_REGION:-${GRCPC_MINIO_PRESIGN_REGION:-us-east-1}}}
      GRCONE_MINIO_ACCESS_KEY: ${GRCONE_MINIO_ACCESS_KEY:-${DIGIGRCONE_MINIO_ACCESS_KEY:-${GRCPC_MINIO_ACCESS_KEY:-${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in stage.env}}}}
      GRCONE_MINIO_SECRET_KEY: ${GRCONE_MINIO_SECRET_KEY:-${DIGIGRCONE_MINIO_SECRET_KEY:-${GRCPC_MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in stage.env}}}}
      GRCONE_MINIO_BUCKET: ${GRCONE_MINIO_BUCKET:-${DIGIGRCONE_MINIO_BUCKET:-${GRCPC_MINIO_BUCKET:-grc-documents}}}
      GRCONE_MINIO_PRESIGNED_URL_EXPIRY_MINUTES: ${GRCONE_MINIO_PRESIGNED_URL_EXPIRY_MINUTES:-${DIGIGRCONE_MINIO_PRESIGNED_URL_EXPIRY_MINUTES:-${GRCPC_MINIO_PRESIGNED_URL_EXPIRY_MINUTES:-15}}}
      GRCONE_MINIO_DEFAULT_MAX_UPLOAD_SIZE_MB: ${GRCONE_MINIO_DEFAULT_MAX_UPLOAD_SIZE_MB:-${DIGIGRCONE_MINIO_DEFAULT_MAX_UPLOAD_SIZE_MB:-${GRCPC_MINIO_DEFAULT_MAX_UPLOAD_SIZE_MB:-25}}}
      GRCONE_MINIO_TEMP_TTL_MINUTES: ${GRCONE_MINIO_TEMP_TTL_MINUTES:-${DIGIGRCONE_MINIO_TEMP_TTL_MINUTES:-${GRCPC_MINIO_TEMP_TTL_MINUTES:-120}}}
      GRCONE_MINIO_TEMPORARY_PREFIX: ${GRCONE_MINIO_TEMPORARY_PREFIX:-${DIGIGRCONE_MINIO_TEMPORARY_PREFIX:-${GRCPC_MINIO_TEMPORARY_PREFIX:-master-data/document/temp}}}
      GRCONE_MINIO_PERMANENT_PREFIX: ${GRCONE_MINIO_PERMANENT_PREFIX:-${DIGIGRCONE_MINIO_PERMANENT_PREFIX:-${GRCPC_MINIO_PERMANENT_PREFIX:-master-data/document/permanent}}}
      GRCONE_MINIO_LIFECYCLE_MODE: ${GRCONE_MINIO_LIFECYCLE_MODE:-VALIDATE}
      GRCONE_MINIO_TEMP_EXPIRATION_ENABLED: ${GRCONE_MINIO_TEMP_EXPIRATION_ENABLED:-${DIGIGRCONE_MINIO_TEMP_EXPIRATION_ENABLED:-${GRCPC_MINIO_TEMP_EXPIRATION_ENABLED:-true}}}
      GRCONE_MINIO_TEMP_EXPIRATION_RULE_ID: ${GRCONE_MINIO_TEMP_EXPIRATION_RULE_ID:-grcone-temp-object-expiration}
      GRCONE_MINIO_TEMP_EXPIRATION_DAYS: ${GRCONE_MINIO_TEMP_EXPIRATION_DAYS:-${DIGIGRCONE_MINIO_TEMP_EXPIRATION_DAYS:-${GRCPC_MINIO_TEMP_EXPIRATION_DAYS:-2}}}

      APP_LOGGING_PATH: /opt/grcone/logs
      ROOT_LOG_LEVEL: ${ROOT_LOG_LEVEL:-INFO}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m}
    entrypoint:
      - sh
      - -c
      - |
        if [ "$$#" -gt 0 ]; then
          exec java -jar /opt/grcone/grcone-app.jar "$$@"
        fi
        exec java $${JAVA_OPTS:-} -jar /opt/grcone/grcone-app.jar
      - grcone-stage
    command: []

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.28-alpine}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      - app
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      PUBLIC_SCHEME: ${PUBLIC_SCHEME:-http}
      GRCONE_MINIO_BUCKET: ${GRCONE_MINIO_BUCKET:-${DIGIGRCONE_MINIO_BUCKET:-${GRCPC_MINIO_BUCKET:-grc-documents}}}
      GRCPC_MINIO_BUCKET: ${GRCONE_MINIO_BUCKET:-${DIGIGRCONE_MINIO_BUCKET:-${GRCPC_MINIO_BUCKET:-grc-documents}}}
      DIGIGRCONE_MINIO_BUCKET: ${GRCONE_MINIO_BUCKET:-${DIGIGRCONE_MINIO_BUCKET:-${GRCPC_MINIO_BUCKET:-grc-documents}}}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ./docker/nginx/start.sh
        target: /opt/grcone/start-nginx.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${NGINX_TLS_DIR:-./tls}
        target: /etc/nginx/tls
        read_only: true
    entrypoint: ["sh", "/opt/grcone/start-nginx.sh"]
